name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore MealPlanner.sln

      - name: Build
        run: dotnet build MealPlanner.sln --no-restore -warnaserror

      - name: Test
        run: dotnet test MealPlanner.sln --no-build
